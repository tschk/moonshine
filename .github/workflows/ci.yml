name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: bun run typecheck:native
      - run: bun run check:catalog
      - run: bun run build
        working-directory: examples/vite-crepus
      - run: bun run build
        working-directory: examples/catalog-gallery
      # next-counter is source example (not a workspace) — avoid pulling next/swc in CI
      - run: test -f examples/next-counter/app/counter.tsx && test -f examples/next-counter/app/page.tsx

  dart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dart/moonshine_jaspr
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze
      - run: dart test
